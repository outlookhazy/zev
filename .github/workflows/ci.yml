name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      # Stock Ubuntu LLVM 18 cannot link the AVR scheduler (R_AVR_7_PCREL out of range) and
      # changes stack-proof results; pin the LLVM 23 toolchain zevc targets.
      - name: Install LLVM 23 (Clang, LLD, compiler-rt) and QEMU
        run: |
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 23
          sudo apt-get install -y --no-install-recommends lld-23 libclang-rt-23-dev qemu-system-arm
          echo "/usr/lib/llvm-23/bin" >> "$GITHUB_PATH"

      - name: Show toolchain versions
        run: |
          clang --version | head -1
          llc --version | grep -i 'llvm version'
          ld.lld --version

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy lints
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Cap test parallelism at 4 to bound concurrent clang/ld.lld/qemu subprocesses and peak RAM.
      - name: Run workspace test suite
        run: cargo test --workspace -- --test-threads=4

      - name: Verify built-in docs and example checks
        run: make doc && make check

      - name: Run Host ASan/UBSan simulations
        run: |
          make demo
          cargo run --quiet --bin zevc -- run --sanitize examples/portable_controller_demo.zev

      - name: Run QEMU Cortex-M3 firmware tests
        run: |
          make qemu
          cargo run --quiet --bin zevc -- run-qemu examples/portable_controller_demo.zev

      - name: Build bare-metal firmware images
        run: make nucleo-f334r8 esp32c6 pico uno nano-every
