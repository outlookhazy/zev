# STMicroelectronics STM32F334R8 (ARM Cortex-M4) Chip Target Specification

[chip]
name = "stm32f334r8"
isa = "arm-cortex-m"
cpu = "cortex-m4"
features = "+vfp4d16sp"
triple = "thumbv7em-none-eabihf"
datalayout = "e-m:e-p:32:32-Fi8-i64:64-v128:64:128-a:0:32-n32-S64"
ptr_bits = 32
opt_level = "-Os"
code_in_ram = false
has_thumb2 = true
has_vtor = true
has_fpu = true
allow_sleep_deep = false
hal_dir = "hal/stm32f3"

[memory]
flash_base = 0x0800_0000
flash_size = 65536
ram_base = 0x2000_0000
ram_size = 12288
stack_reserve_bytes = 1024

[irq]
model = "cortex-m-nvic"
max_irqs = 84
min_vector_irqs = 84

[image]
format = "raw-bin"
